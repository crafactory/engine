name: Pinned real plugin startup boundaries
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install-deps chromium
      - run: node scripts/corpus.mjs
        env:
          ENGINE_PLUGIN_CORPUS: ${{ runner.temp }}/plugin-corpus
      - run: xvfb-run -a npm run test:desktop -- corpus.spec.ts
        env:
          ENGINE_PLUGIN_CORPUS: ${{ runner.temp }}/plugin-corpus
          ENGINE_CORPUS_REPORT: ${{ runner.temp }}/plugin-corpus-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-plugin-startup-results
          path: |
            ${{ runner.temp }}/plugin-corpus-results
            test-results-desktop
